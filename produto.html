<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadeira Artesanal</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111;
color:white;
font-family:'Montserrat',sans-serif;
}

.container{
display:grid;
grid-template-columns:1fr 1fr;
min-height:100vh;
}

.gallery{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:20px;
}

.gallery img{
width:100%;
height:500px;
object-fit:cover;
border-radius:20px;
transition:.4s;
}

.gallery img:hover{
transform:scale(1.03);
}

.info{
padding:80px;
display:flex;
justify-content:center;
flex-direction:column;
position:sticky;
top:0;
height:100vh;
}

.info h1{
font-size:60px;
margin-bottom:20px;
}

.price{
font-size:40px;
color:#C89B6D;
margin-bottom:30px;
}

.desc{
line-height:2;
color:#ccc;
margin-bottom:40px;
}

button{
padding:20px;
border:none;
background:#C89B6D;
font-size:18px;
cursor:pointer;
border-radius:50px;
transition:.4s;
}

button:hover{
transform:scale(1.03);
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.info{
position:relative;
height:auto;
padding:40px;
}

.gallery{
grid-template-columns:1fr;
}

}

</style>

</head>
<body>

<div class="container">

<div class="gallery">

<img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop">

<img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?q=80&w=1200&auto=format&fit=crop">

<img src="https://images.unsplash.com/photo-1484101403633-562f891dc89a?q=80&w=1200&auto=format&fit=crop">

<img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop">

</div>

<div class="info">

<h1>Cadeira Artesanal</h1>

<div class="price">
R$ 349,99
</div>

<div class="desc">

Elegância artesanal inspirada no estilo boho contemporâneo.
Uma peça sofisticada, confortável e exclusiva para ambientes
com personalidade e aconchego.

</div>

<button>
Comprar Agora
</button>

</div>

</div>

</body>
</html>
